<svg width="750" height="1050" viewBox="0 0 750 1050" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Snowbound Voltage card back">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4fbff"/>
      <stop offset="35%" stop-color="#c7ebfb"/>
      <stop offset="72%" stop-color="#6fb7d4"/>
      <stop offset="100%" stop-color="#203949"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9feff"/>
      <stop offset="50%" stop-color="#87d7f7"/>
      <stop offset="100%" stop-color="#385f74"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ecffff"/>
      <stop offset="45%" stop-color="#8fe2ff"/>
      <stop offset="100%" stop-color="#2c4e63"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8fbff"/>
      <stop offset="50%" stop-color="#58d6ff"/>
      <stop offset="100%" stop-color="#d8fbff"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="snow" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e8fbff" opacity="0.45"/>
      <circle cx="12" cy="9" r="1" fill="#e8fbff" opacity="0.35"/>
      <circle cx="20" cy="15" r="1" fill="#e8fbff" opacity="0.3"/>
      <circle cx="8" cy="20" r="1" fill="#e8fbff" opacity="0.4"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="750" height="1050" rx="40" fill="url(#bg)"/>
  <rect x="8" y="8" width="734" height="1034" rx="34" fill="none" stroke="#d6f7ff" stroke-width="4" opacity="0.75"/>
  <rect x="24" y="24" width="702" height="1002" rx="26" fill="none" stroke="url(#frame)" stroke-width="8"/>
  <rect x="44" y="44" width="662" height="962" rx="20" fill="none" stroke="#22485a" stroke-width="2" opacity="0.8"/>

  <rect x="0" y="0" width="750" height="1050" fill="url(#snow)" opacity="0.35"/>

  <g stroke="url(#trace)" stroke-width="4" fill="none" opacity="0.82" filter="url(#softGlow)">
    <path d="M96 170 H250 V222 H334"/>
    <path d="M654 170 H500 V222 H416"/>
    <path d="M96 880 H250 V828 H334"/>
    <path d="M654 880 H500 V828 H416"/>

    <path d="M140 320 H270 V372 H336"/>
    <path d="M610 320 H480 V372 H414"/>
    <path d="M140 730 H270 V678 H336"/>
    <path d="M610 730 H480 V678 H414"/>

    <path d="M214 104 H214 V248"/>
    <path d="M536 104 H536 V248"/>
    <path d="M214 946 H214 V802"/>
    <path d="M536 946 H536 V802"/>
  </g>

  <g>
    <circle cx="375" cy="525" r="220" fill="none" stroke="#d4f8ff" stroke-width="5" opacity="0.95"/>
    <circle cx="375" cy="525" r="188" fill="none" stroke="#7ad8fb" stroke-width="4" opacity="0.9"/>
    <circle cx="375" cy="525" r="158" fill="none" stroke="#2d6179" stroke-width="2" opacity="0.85"/>

    <circle cx="375" cy="525" r="128" fill="url(#core)" opacity="0.9"/>
    <circle cx="375" cy="525" r="104" fill="none" stroke="#ddfbff" stroke-width="3" opacity="0.85"/>

    <path d="M375 420 L414 486 L492 486 L434 541 L456 618 L375 576 L294 618 L316 541 L258 486 L336 486 Z"
      fill="#e7fbff" opacity="0.88"/>
    <path d="M375 444 L405 496 L465 496 L420 538 L437 596 L375 564 L313 596 L330 538 L285 496 L345 496 Z"
      fill="#6bd8ff" opacity="0.62"/>
  </g>

  <g stroke="#c3f5ff" stroke-width="2" opacity="0.7">
    <line x1="375" y1="182" x2="375" y2="316"/>
    <line x1="375" y1="734" x2="375" y2="868"/>
    <line x1="32" y1="525" x2="166" y2="525"/>
    <line x1="584" y1="525" x2="718" y2="525"/>
  </g>

  <g fill="#f6feff" opacity="0.9">
    <circle cx="375" cy="182" r="6"/>
    <circle cx="375" cy="868" r="6"/>
    <circle cx="166" cy="525" r="6"/>
    <circle cx="584" cy="525" r="6"/>
  </g>
