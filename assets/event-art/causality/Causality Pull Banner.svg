<svg xmlns="http://www.w3.org/2000/svg" width="260" height="132" viewBox="0 0 260 132" role="img" aria-labelledby="title desc">
  <title id="title">Causality Stellar Wish banner art</title>
  <desc id="desc">An original causal oracle silhouette framed by cyan and magenta timelines on a black background.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="48%" r="72%">
      <stop offset="0" stop-color="#14223b"/>
      <stop offset="0.52" stop-color="#080d1d"/>
      <stop offset="1" stop-color="#020306"/>
    </radialGradient>
    <linearGradient id="cyanArc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#41e8ff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#55e8ff"/>
      <stop offset="1" stop-color="#b7fbff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="roseArc" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff4fb4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff6fc5"/>
      <stop offset="1" stop-color="#ffd1ed" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9faff"/>
      <stop offset="0.32" stop-color="#6488b9"/>
      <stop offset="0.72" stop-color="#202943"/>
      <stop offset="1" stop-color="#070a13"/>
    </linearGradient>
    <filter id="glowCyan" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRose" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="260" height="132" fill="#000"/>
  <rect width="260" height="132" fill="url(#space)"/>

  <g fill="#d8faff" opacity="0.75">
    <circle cx="18" cy="24" r="0.8"/><circle cx="41" cy="92" r="0.7"/><circle cx="71" cy="17" r="0.6"/>
    <circle cx="198" cy="19" r="0.8"/><circle cx="232" cy="80" r="0.7"/><circle cx="247" cy="34" r="0.55"/>
    <circle cx="154" cy="112" r="0.65"/><circle cx="107" cy="105" r="0.5"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M-18 112 C42 126 54 30 126 49 S205 101 278 18" stroke="url(#cyanArc)" stroke-width="2.4" filter="url(#glowCyan)"/>
    <path d="M-15 22 C42 76 79 108 136 77 S208 6 275 101" stroke="url(#roseArc)" stroke-width="1.8" filter="url(#glowRose)"/>
    <path d="M25 130 C74 79 92 55 130 65 S190 117 238 68" stroke="#55d9ee" stroke-opacity="0.28" stroke-width="0.8"/>
  </g>

  <g transform="translate(130 58)">
    <circle r="18" fill="#02040b" stroke="#7cefff" stroke-opacity="0.65" stroke-width="1"/>
    <circle r="11" fill="none" stroke="#ff79c9" stroke-width="1.2" stroke-dasharray="2 3"/>
    <path d="M-3-7 L0-12 L3-7 L7-3 L12 0 L7 3 L3 8 L0 13 L-3 8 L-8 3 L-13 0 L-8-3Z" fill="#c7faff" filter="url(#glowCyan)"/>
    <path d="M0-5 L3 0 L0 6 L-3 0Z" fill="#ff8fd3"/>
  </g>

  <g transform="translate(132 76)">
    <path d="M-8-15 C-5-20 5-20 8-15 L9-6 L16 0 L8 5 L20 45 L-20 45 L-8 5 L-16 0 L-9-6Z" fill="url(#cloak)" stroke="#c7faff" stroke-opacity="0.58" stroke-width="0.8"/>
    <path d="M-6-13 C-3-17 3-17 6-13 L5-5 L0 0 L-5-5Z" fill="#0a1020" stroke="#ffb7df" stroke-opacity="0.75" stroke-width="0.8"/>
    <path d="M-16 3 C-29 8-34 18-41 27 M16 3 C29 8 34 18 41 27" fill="none" stroke="#a8f7ff" stroke-width="2" stroke-linecap="round" filter="url(#glowCyan)"/>
    <path d="M-6 9 L-25 39 M6 9 L25 39" stroke="#ff8fd3" stroke-opacity="0.7" stroke-width="1"/>
  </g>

  <g fill="#a9f5ff" filter="url(#glowCyan)">
    <path d="M35 47 l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path d="M221 48 l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z"/>
  </g>
  <g fill="#ff9ed8" filter="url(#glowRose)">
    <path d="M205 94 l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z"/>
    <path d="M63 39 l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/>
  </g>

  <rect x="0.5" y="0.5" width="259" height="131" fill="none" stroke="#62eaff" stroke-opacity="0.36"/>
  <path d="M10 121 H250" stroke="#ff71c6" stroke-opacity="0.35" stroke-width="0.7"/>
</svg>
